name: net-probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live site
        run: |
          echo "probe-time: $(date -u)" > net-probe.txt
          curl -s -o /dev/null -w "status=%{http_code}\n" https://rcloudcssp.netlify.app/ | tee -a net-probe.txt
      - name: Commit result
        run: |
          git config user.name "arena-bot" && git config user.email "bot@example.com"
          git add net-probe.txt && git commit -m "net probe result" || true
          git push
