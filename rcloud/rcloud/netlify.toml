# rCloud — Netlify deployment (Next.js via the official Netlify plugin).
# No PHP or shared hosting required.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Static schedule dataset for the CSSP Room Finder. Short max-age so admin
# updates propagate quickly; stale-while-revalidate keeps repeat visits fast.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=604800"

# API for live roomfinder schedule — cache 5 min, stale 1 hour
[[headers]]
  for = "/api/roomfinder/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

# SPA-style fallbacks are handled by the Next.js plugin;
# add redirects here only for legacy URLs, e.g.:
# [[redirects]]
#   from = "/old-path"
#   to = "/new-path"
#   status = 301
